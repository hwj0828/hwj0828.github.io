# Start here for site-wide settings. See README.md for the editing guide.
# Page text, navigation and homepage sections: _pages/*.md
# Colors, spacing and other style overrides: _sass/_custom.scss
# Library URLs and versions: _data/libraries.yml (usually leave alone)

# Identity and metadata
title: blank # "blank" uses your full name
first_name: Wenjie
middle_name:
last_name: Hu
description: >
  Wenjie Hu's academic website. Research in causal inference, data integration,
  and high-dimensional statistics.
keywords: Wenjie Hu, statistics, causal inference, data integration
lang: en
icon: 🦊
url: https://hwj0828.github.io
baseurl: "" # Keep empty for this GitHub Pages address
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
last_updated: true

# Layout and visible features
max_width: 930px
navbar_fixed: true
footer_fixed: true
back_to_top: true
enable_darkmode: true
enable_navbar_social: false
enable_progressbar: true
search_enabled: true
socials_in_search: true
posts_in_search: true
enable_math: true
enable_medium_zoom: true
lazy_loading_images: true

# Analytics (your existing measurement ID)
enable_google_analytics: true
google_analytics: G-K2GZG17S2M

# Blog: add posts in _posts/YYYY-MM-DD-title.md
blog_name: Blogs
blog_description: some random thoughts
permalink: /blog/:year/:title/
pagination:
  enabled: true
related_blog_posts:
  enabled: true
  max_related: 5
# Add only tags/categories used by your own posts, to avoid dead links.
display_tags: []
display_categories: []

# Publications: edit _bibliography/papers.bib and _bibliography/talks.bib
bib_search: true
max_author_limit: 10
more_authors_animation_delay: 10
enable_publication_thumbnails: true
enable_video_embedding: false
enable_publication_badges:
  altmetric: true
  dimensions: true
  google_scholar: true
scholar:
  last_name: [Hu]
  first_name: [Wenjie]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending
filtered_bibtex_keywords:
  [abbr, abstract, additional_info, altmetric, annotation, arxiv, award, award_name,
   bibtex_show, blog, code, google_scholar_id, html, inspirehep_id, pdf, poster,
   preview, selected, slides, supp, video, website]

# Build settings below this line rarely need editing.
collections:
  news:
    output: true

defaults:
  - scope:
      path: ""
      type: news
    values:
      layout: post
  - scope:
      path: assets
    values:
      sitemap: false

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
sass:
  style: compressed
include: ["_pages", "_scripts"]
exclude:
  - bin/
  - Dockerfile
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - purgecss.config.js
  - README.md
  - requirements.txt
  - node_modules/
  - vendor/
keep_files: [CNAME, .nojekyll]

plugins:
  - jekyll-archives-v2
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jemoji
jekyll-minifier:
  compress_javascript: false
  exclude: ["robots.txt", "assets/js/search/*.js"]
terser:
  compress:
    drop_console: true
jekyll-archives:
  posts:
    enabled: [year, tags, categories]
    permalinks:
      year: "/blog/:year/"
      tags: "/blog/:type/:name/"
      categories: "/blog/:type/:name/"
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
imagemagick:
  enabled: true
  widths: [480, 800, 1400]
  input_directories: [assets/img/]
  input_formats: [".jpg", ".jpeg", ".png", ".tiff", ".gif"]
  output_formats:
    webp: "-quality 85"
